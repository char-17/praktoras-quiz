<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <title>Τεστ Πιστοποίησης Ασφαλιστικού Πράκτορα</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      * {
        box-sizing: border-box;
      }
      /* iOS: ενεργοποίηση :active states σε touch */
      html {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        max-width: 1000px;
        margin: 0 auto;
        padding: 16px;
        line-height: 1.5;
        background: #f5f5f5;
      }
      /* iOS: reset default button styling + αποφυγή 300ms tap delay */
      button {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        touch-action: manipulation;
      }
      h1 {
        text-align: center;
        margin-bottom: 8px;
      }
      h2 {
        margin-top: 0;
      }
      .subtitle {
        text-align: center;
        margin-bottom: 16px;
        color: #555;
      }
      /* Sticky top bar — badges αριστερά, actions δεξιά */
      .stats {
        position: -webkit-sticky; /* iOS Safari fallback */
        position: sticky;
        top: 0;
        background: #f5f5f5;
        padding: 8px 0 12px 0;
        margin-bottom: 12px;
        border-bottom: 1px solid #ddd;
        display: -webkit-flex; /* iOS Safari fallback */
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        z-index: 10;
      }
      .stats-left {
        display: -webkit-flex;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      /* iOS gap fallback: margin σε badges/buttons αν gap δεν υποστηρίζεται */
      .stats-left > * { margin: 2px 4px; }
      /* Font button group — κρυμμένο σε desktop, εμφανίζεται σε mobile */
      .font-group {
        display: none;
      }
      .font-group-btn {
        -webkit-appearance: none;
        appearance: none;
        touch-action: manipulation;
        background: white;
        border: 1px solid #ddd;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        padding: 3px 10px;
        min-width: 34px;
        text-align: center;
      }
      /* Αριστερό κουμπί: στρογγυλό αριστερά */
      .font-group-btn:first-child {
        border-radius: 999px 0 0 999px;
        border-right: none;
      }
      /* Δεξί κουμπί: στρογγυλό δεξιά */
      .font-group-btn:last-child {
        border-radius: 0 999px 999px 0;
      }
      .stats-right {
        display: -webkit-flex;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-left: auto;
      }
      .badge {
        background: white;
        border-radius: 999px;
        padding: 4px 12px;
        border: 1px solid #ddd;
        font-size: 14px;
      }
      .badge span {
        font-weight: 600;
      }
      /* Action badges — κουμπιά στο sticky bar, badge style */
      .action-badge {
        background: white;
        border-radius: 999px;
        padding: 4px 12px;
        border: 1px solid #ddd;
        font-size: 13px;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.15s, border-color 0.15s;
        white-space: nowrap;
        font-family: inherit;
      }
      .action-badge:hover {
        background: #e8e8e8;
        border-color: #bbb;
      }
      .action-badge.primary-action {
        background: #007bff;
        color: white;
        border-color: #007bff;
      }
      .action-badge.primary-action:hover {
        background: #0069d9;
      }
      /* Φίλτρο ενεργό */
      .action-badge.filter-active {
        background: #dc3545;
        color: white;
        border-color: #dc3545;
      }
      .action-badge.filter-active:hover {
        background: #c82333;
      }
      /* Hamburger μενού για mobile */
      .menu-toggle {
        display: none;
        background: white;
        border: 1px solid #ddd;
        border-radius: 50%;
        width: 44px; /* iOS: ελάχιστο 44px touch target */
        height: 44px;
        font-size: 18px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        font-family: inherit;
        -webkit-user-select: none;
        user-select: none;
        position: relative; /* iOS: ensure clickable */
        z-index: 11;
      }
      .mobile-menu {
        display: none;
        -webkit-flex-direction: column;
        flex-direction: column;
        gap: 6px;
        -webkit-flex-basis: 100%;
        flex-basis: 100%;
        width: 100%;
        padding-top: 8px;
      }
      /* iOS gap fallback */
      .mobile-menu > * { margin-bottom: 3px; }
      .mobile-menu .action-badge {
        text-align: center;
        display: block;
        width: 100%;
        border-radius: 6px;
      }
      .mobile-menu.open {
        display: -webkit-flex; /* iOS Safari fallback */
        display: flex;
      }
      /* Όταν το menu είναι ανοιχτό, κρύψε τα badges */
      .mobile-menu.open ~ .stats-left-hide { display: none; }
      /* Όταν το menu είναι ανοιχτό, κρύψε τα badges αλλά κράτα τον χώρο */
      .stats.menu-open .stats-left {
        visibility: hidden;
      }
      #questionsContainer {
        margin-top: 8px;
      }
      .question-card {
        background: white;
        border-radius: 10px;
        border: 1px solid #e0e0e0;
        padding: 12px 12px 10px 12px;
        margin-bottom: 10px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .question-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .question-number {
        color: #666;
        margin-right: 4px;
      }
      .options {
        list-style: none;
        padding: 0;
        margin: 6px 0 0 0;
      }
      .option {
        margin-bottom: 4px;
      }
      /* Βασικό μέγεθος ερωτήσεων — αλλάζει από τα κουμπιά A-/A+ */
      #questionsContainer {
        font-size: 14px;
      }
      .option button {
        width: 100%;
        text-align: left;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fafafa;
        cursor: pointer;
        font-size: inherit; /* κληρονομεί από #questionsContainer */
        -webkit-transition: background 0.15s ease, border-color 0.15s ease,
          transform 0.05s ease;
        transition: background 0.15s ease, border-color 0.15s ease,
          transform 0.05s ease;
        display: block;
        white-space: normal;
        -webkit-user-select: none;
        user-select: none;
      }
      .option button:hover:not(.disabled) {
        background: #f0f0f0;
      }
      .option button:active:not(.disabled) {
        transform: scale(0.995);
      }
      .option-letter {
        font-weight: 600;
        margin-right: 4px;
      }
      .option button.correct {
        background: #d4edda;
        border-color: #28a745;
      }
      .option button.incorrect {
        background: #f8d7da;
        border-color: #dc3545;
      }
      .option button.disabled {
        cursor: default;
        opacity: 0.9;
      }
      /* (controls section αφαιρέθηκε — κουμπιά μεταφέρθηκαν στο sticky bar) */
      .summary {
        border-top: 2px solid #ddd;
        margin-top: 20px;
        padding-top: 12px;
        background: #fff;
        border-radius: 8px;
        padding: 12px 14px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .summary h2 {
        margin-top: 0;
        margin-bottom: 6px;
        font-size: 18px;
      }
      .summary p {
        margin: 4px 0;
      }
      /* Dark mode toggle button */
      .theme-toggle {
        position: fixed;
        top: 12px;
        right: 12px;
        background: none;
        border: 1px solid #ccc;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        font-size: 20px;
        cursor: pointer;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, border-color 0.2s;
      }
      .theme-toggle:hover {
        background: #e0e0e0;
      }

      /* Dark mode styles */
      body.dark {
        background: #1a1a2e;
        color: #e0e0e0;
      }
      body.dark .stats {
        background: #1a1a2e;
        border-bottom-color: #2a2a4a;
      }
      body.dark .badge {
        background: #16213e;
        border-color: #2a2a4a;
        color: #e0e0e0;
      }
      body.dark .font-group-btn {
        background: #16213e;
        border-color: #2a2a4a;
        color: #e0e0e0;
      }
      body.dark .question-card {
        background: #16213e;
        border-color: #2a2a4a;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      body.dark .question-number {
        color: #999;
      }
      body.dark .subtitle {
        color: #888;
      }
      body.dark .option button {
        background: #0f3460;
        border-color: #2a2a4a;
        color: #e0e0e0;
      }
      body.dark .option button:hover:not(.disabled) {
        background: #1a4a7a;
      }
      body.dark .option button.correct {
        background: #1b4332;
        border-color: #2d6a4f;
      }
      body.dark .option button.incorrect {
        background: #4a1520;
        border-color: #922b3e;
      }
      body.dark .summary {
        background: #16213e;
        border-top-color: #2a2a4a;
        color: #e0e0e0;
      }
      body.dark .summary p[style] {
        color: #888 !important;
      }
      /* Dark mode: action badges & menu */
      body.dark .action-badge {
        background: #16213e;
        border-color: #2a2a4a;
        color: #e0e0e0;
      }
      body.dark .action-badge:hover {
        background: #1e2d4d;
        border-color: #3a3a5a;
      }
      body.dark .action-badge.primary-action {
        background: #1a6ddb;
        border-color: #1a6ddb;
        color: white;
      }
      body.dark .action-badge.primary-action:hover {
        background: #155bb5;
      }
      body.dark .action-badge.filter-active {
        background: #dc3545;
        border-color: #dc3545;
        color: white;
      }
      body.dark .action-badge.filter-active:hover {
        background: #c82333;
      }
      body.dark .menu-toggle {
        background: #16213e;
        border-color: #2a2a4a;
        color: #e0e0e0;
      }
      body.dark .menu-toggle:hover {
        background: #1e2d4d;
      }
      body.dark .mobile-menu {
        border-top-color: #2a2a4a;
      }
      body.dark .theme-toggle {
        border-color: #2a2a4a;
        color: #e0e0e0;
      }
      body.dark .theme-toggle:hover {
        background: #2a2a4a;
      }

      /* Stats modal — αναδυόμενο παράθυρο */
      #statsOverlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.45);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      #statsOverlay.open {
        display: flex;
      }
      #statsPanel {
        background: #fff;
        border-radius: 10px;
        padding: 20px 22px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.18);
        max-width: 460px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        position: relative;
      }
      #statsPanel h3 {
        font-size: 16px;
        margin: 0 0 10px 0;
      }
      /* Κουμπί κλεισίματος modal */
      .stats-close {
        position: absolute;
        top: 10px; right: 14px;
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        color: #666;
        line-height: 1;
      }
      .stats-close:hover { color: #333; }
      /* Λίστα προβληματικών */
      #statsPanel .problem-list {
        max-height: 50vh;
        overflow-y: auto;
        padding: 0;
        margin: 4px 0;
        list-style: none;
        font-size: 14px;
        line-height: 1.6;
      }
      #statsPanel .problem-list li {
        padding: 2px 0;
        border-bottom: 1px solid #eee;
      }
      /* Dark mode modal */
      body.dark #statsOverlay {
        background: rgba(0,0,0,0.6);
      }
      body.dark #statsPanel {
        background: #16213e;
        color: #e0e0e0;
      }
      body.dark #statsPanel .problem-list li {
        border-bottom-color: #2a2a4a;
      }
      body.dark .stats-close { color: #999; }
      body.dark .stats-close:hover { color: #e0e0e0; }

      @media (max-width: 600px) {
        body {
          padding: 8px;
        }
        /* Mobile: badges + hamburger σε μία γραμμή */
        .stats {
          flex-wrap: wrap;
          align-items: center;
          padding-right: 50px; /* χώρος για το absolute hamburger (44px + padding) */
          position: relative; /* iOS: contain block for absolute hamburger */
        }
        .stats-left {
          flex-wrap: wrap;
          -webkit-flex: 1;
          flex: 1;
          gap: 4px;
        }
        .badge {
          font-size: 12px;
          padding: 3px 8px;
        }
        .stats-right {
          display: none;
        }
        /* Hamburger: absolute ώστε να μένει πάντα στη θέση του */
        .menu-toggle {
          display: -webkit-flex; /* iOS Safari fallback */
          display: flex;
          position: absolute;
          right: 0;
          top: 2px;
        }
        /* Εμφάνιση A-/A+ button group σε mobile */
        .font-group {
          display: -webkit-inline-flex;
          display: inline-flex;
        }
        /* Κρύψε το fixed theme toggle — υπάρχει στο mobile menu */
        .theme-toggle {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Dark/light mode toggle -->
    <button class="theme-toggle" id="themeToggle" title="Εναλλαγή dark/light mode">☀️</button>

    <h1>Τεστ Πιστοποίησης</h1>
    <div class="subtitle">
      Ερωτήσεις πολλαπλής επιλογής με αυτόματη διόρθωση.
    </div>

    <div class="stats">
      <!-- Αριστερά: μετρητές + font size buttons (mobile) -->
      <div class="stats-left">
        <div class="badge">Απαντημένες: <span id="answeredCount">0</span></div>
        <div class="badge">Σωστές: <span id="correctCount">0</span></div>
        <div class="badge">Λανθασμένες: <span id="wrongCount">0</span></div>
        <div class="badge">Σύνολο: <span id="totalCount"></span></div>
        <!-- A-/A+ ομαδοποιημένα — εμφανίζονται μόνο σε mobile -->
        <div class="font-group">
          <button class="font-group-btn" id="fontDecBtnBar">A-</button>
          <button class="font-group-btn" id="fontIncBtnBar">A+</button>
        </div>
      </div>
      <!-- Δεξιά: action buttons (desktop) -->
      <div class="stats-right">
        <button class="action-badge" id="filterProblemsButton">Προβληματικές</button>
        <button class="action-badge" id="resetButton">Επανεκκίνηση</button>
        <button class="action-badge" id="statsButton">Στατιστικά</button>
        <button class="action-badge" id="clearStatsButton">Καθαρισμός</button>
        <button class="action-badge" id="fontDecBtn">A-</button>
        <button class="action-badge" id="fontIncBtn">A+</button>
      </div>
      <!-- Hamburger μενού (mobile) -->
      <button class="menu-toggle" id="menuToggle" title="Μενού">☰</button>
      <!-- Mobile dropdown -->
      <div class="mobile-menu" id="mobileMenu">
        <button class="action-badge" id="filterProblemsButtonMobile">Προβληματικές</button>
        <button class="action-badge" id="resetButtonMobile">Επανεκκίνηση</button>
        <button class="action-badge" id="statsButtonMobile">Στατιστικά</button>
        <button class="action-badge" id="clearStatsButtonMobile">Καθαρισμός στατιστικών</button>
        <button class="action-badge" id="themeToggleMobile">🌙 Dark mode</button>
      </div>
    </div>

    <div id="questionsContainer"></div>

    <!-- Modal στατιστικών — αναδυόμενο παράθυρο -->
    <div id="statsOverlay">
      <div id="statsPanel">
        <button class="stats-close" id="statsClose" title="Κλείσιμο">&times;</button>
        <div id="statsContent"></div>
      </div>
    </div>

    <script>
      // iOS debug: εμφάνιση JS σφαλμάτων στη σελίδα αν κάτι αποτύχει
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.getElementById("jsErrorBox");
        if (!errDiv) {
          errDiv = document.createElement("div");
          errDiv.id = "jsErrorBox";
          errDiv.style.cssText = "background:#ff0;color:#c00;padding:12px;font-size:14px;position:fixed;top:0;left:0;right:0;z-index:9999;white-space:pre-wrap;";
          document.body.insertBefore(errDiv, document.body.firstChild);
        }
        errDiv.textContent += "ERROR line " + line + ": " + msg + "\n";
        return false;
      };

      var questions = [
        {
          number: 1,
          question:
            "Ο ν. 4583/2018 ενσωματώνει τις διατάξεις της ενωσιακής νομοθεσίας σχετικά με….",
          correctLetter: "α",
          options: [
            {
              letter: "α",
              text: "τη δραστηριότητα διανομής των (αντ)ασφαλιστικών προϊόντων, ανεξαρτήτως δικτύου.",
            },
            {
              letter: "β",
              text: "την προώθηση ασφαλιστικών προϊόντων από ασφαλιστικούς διαμεσολαβητές.",
            },
            {
              letter: "γ",
              text: "τις απευθείας πωλήσεις των ασφαλιστικών επιχειρήσεων.",
            },
            {
              letter: "δ",
              text: "την προώθηση ασφαλιστικών προϊόντων μέσω bancassurance και επιχειρήσεων επενδύσεων.",
            },
          ],
        },
        {
          number: 2,
          question:
            "Τι ακριβώς είναι η διανομή (αντ)ασφαλιστικών προϊόντων;",
          correctLetter: "δ",
          options: [
            {
              letter: "α",
              text: "Οι δραστηριότητες παροχής συμβουλής, πρότασης ή διενέργειας άλλων προπαρασκευαστικών εργασιών για τη σύναψη ασφαλιστικών συμβάσεων, οι δραστηριότητες σύναψης αυτών, ή οι δραστηριότητες παροχής βοήθειας κατά τη διαχείριση και την εκτέλεση των εν λόγω συμβάσεων, ιδίως σε περίπτωση επέλευσης του ασφαλιζομένου κινδύνου.",
            },
            {
              letter: "β",
              text: "Η παροχή και μέσω ιστοτόπου ή κάποιου άλλου μέσου, πληροφοριών σχετικά με μία ή περισσότερες ασφαλιστικές συμβάσεις βάσει κριτηρίων που επιλέγονται από τον πελάτη, εφόσον μέσω του ιστοτόπου ο πελάτης είναι σε θέση να συνάψει άμεσα ή έμμεσα μια ασφαλιστική σύμβαση.",
            },
            {
              letter: "γ",
              text: "Η παροχή μέσω ιστότοπου καταλόγου κατάταξης ασφαλιστικών προϊόντων, συμπεριλαμβανομένης της σύγκρισης των τιμών και των προϊόντων ή και των προσφερομένων εκπτώσεων από την ασφαλιστική επιχείρηση επί του ασφαλίστρου, εφόσον μέσω του ιστοτόπου ο πελάτης είναι σε θέση να συνάψει άμεσα ή έμμεσα μια ασφαλιστική σύμβαση.",
            },
            {
              letter: "δ",
              text: "Όλες οι απαντήσεις είναι σωστές.",
            },
          ],
        },
        {
          number: 3,
          question:
            "Ποιοι επιτρέπεται να ασκούν τη δραστηριότητα διανομής ασφαλιστικών προϊόντων;",
          correctLetter: "γ",
          options: [
            {
              letter: "α",
              text: "Μόνο οι ασφαλιστικοί διαμεσολαβητές και οι ασφαλιστικοί διαμεσολαβητές δευτερεύουσας δραστηριότητας.",
            },
            {
              letter: "β",
              text: "Οι ασφαλιστικοί πράκτορες, οι μεσίτες ασφαλίσεων, οι συντονιστές ασφαλιστικών πρακτόρων, οι ασφαλιστικοί διαμεσολαβητές δευτερεύουσας δραστηριότητας.",
            },
            {
              letter: "γ",
              text: "Οι ασφαλιστικοί διαμεσολαβητές δηλαδή οι ασφαλιστικοί πράκτορες, οι συντονιστές ασφαλιστικών πρακτόρων και οι μεσίτες ασφαλίσεων, οι ασφαλιστικές επιχειρήσεις και οι ασφαλιστικοί διαμεσολαβητές δευτερεύουσας δραστηριότητας.",
            },
            {
              letter: "δ",
              text: "Μόνο οι ασφαλιστικοί πράκτορες, οι μεσίτες ασφαλίσεων, οι συντονιστές ασφαλιστικών πρακτόρων, τα πιστωτικά ιδρύματα και οι επιχειρήσεις επενδύσεων.",
            },
          ],
        },
        {
          number: 4,
          question:
            "Η Εποπτική Αρχή αποστέλλει σε ασφαλιστικό πράκτορα Π ένα έγγραφο, με το οποίο διερευνά τη βασιμότητα μιας καταγγελίας που υποβλήθηκε σε βάρος του Π, από πελάτη του. Σε σχέση με την ποιότητα των παρεχόμενων πληροφοριών, ο ασφαλιστικός πράκτορας …",
          correctLetter: "β",
          options: [
            {

      var filterProblems = false; // φίλτρο προβληματικών ερωτήσεων
      var currentQuestions = questions; // τρέχουσα λίστα (όλες ή φιλτραρισμένες)
      var questionState = [];
      // Αρχικοποίηση questionState
      for (var _i = 0; _i < questions.length; _i++) {
        questionState.push({ answered: false, isCorrect: null });
      }

      function updateStats() {
        var answered = 0;
        var correct = 0;
        var wrong = 0;

        for (var i = 0; i < questionState.length; i++) {
          if (questionState[i].answered) {
            answered++;
            if (questionState[i].isCorrect) {
              correct++;
            } else {
              wrong++;
            }
          }
        }

        document.getElementById("answeredCount").textContent = answered;
        document.getElementById("correctCount").textContent = correct;
        document.getElementById("wrongCount").textContent = wrong;
      }

      // === Batch rendering — αποφυγή iOS Safari script timeout ===
      var BATCH_SIZE = 30; // ερωτήσεις ανά batch

      function createQuestionCard(q, qIndex) {
        var card = document.createElement("div");
        card.className = "question-card";

        var title = document.createElement("div");
        title.className = "question-title";
        title.innerHTML =
          '<span class="question-number">Ερώτηση ' +
          q.number +
          ".</span>" +
          " " +
          q.question;
        card.appendChild(title);

        var ul = document.createElement("ul");
        ul.className = "options";

        var buttons = [];

        for (var optIndex = 0; optIndex < q.options.length; optIndex++) {
          var opt = q.options[optIndex];
          var li = document.createElement("li");
          li.className = "option";

          var btn = document.createElement("button");
          var letterSpan = document.createElement("span");
          letterSpan.className = "option-letter";
          letterSpan.textContent = opt.letter + ")";
          btn.appendChild(letterSpan);

          var textNode = document.createTextNode(" " + opt.text);
          btn.appendChild(textNode);

          // Closure για σωστό qIndex/optIndex σε iOS
          (function(qi, oi, btns) {
            btn.addEventListener("click", function() {
              handleAnswer(qi, oi, btns);
            });
          })(qIndex, optIndex, buttons);

          li.appendChild(btn);
          ul.appendChild(li);
          buttons.push(btn);
        }

        card.appendChild(ul);
        return card;
      }

      function renderQuestions() {
        var container = document.getElementById("questionsContainer");
        container.innerHTML = "";

        // Φίλτρο: αν ενεργό, δείξε μόνο ερωτήσεις με ≥1 λάθος στο localStorage
        var stats = loadStats();
        var filteredQuestions = filterProblems
          ? questions.filter(function(q) { return stats[String(q.number)] && stats[String(q.number)].wrong > 0; })
          : questions;

        // Αποθήκευση τρέχουσας λίστας για χρήση στο handleAnswer
        currentQuestions = filteredQuestions;
        document.getElementById("totalCount").textContent = filteredQuestions.length;

        // Reset questionState για τις φιλτραρισμένες ερωτήσεις
        questionState.length = 0;
        for (var i = 0; i < filteredQuestions.length; i++) {
          questionState.push({ answered: false, isCorrect: null });
        }

        // Batch rendering: φόρτωση σε ομάδες για αποφυγή iOS script timeout
        var batchIndex = 0;

        function renderBatch() {
          var fragment = document.createDocumentFragment();
          var end = Math.min(batchIndex + BATCH_SIZE, filteredQuestions.length);

          for (var j = batchIndex; j < end; j++) {
            fragment.appendChild(createQuestionCard(filteredQuestions[j], j));
          }

          container.appendChild(fragment);
          batchIndex = end;

          // Αν υπάρχουν κι άλλες ερωτήσεις, συνέχισε στο επόμενο frame
          if (batchIndex < filteredQuestions.length) {
            setTimeout(renderBatch, 0);
          }
        }

        renderBatch();
      }

      function handleAnswer(qIndex, optIndex, buttons) {
        var state = questionState[qIndex];
        if (state.answered) {
          return; // δεν επιτρέπεται αλλαγή απάντησης
        }

        var question = currentQuestions[qIndex];
        var chosen = question.options[optIndex];

        var isCorrect = chosen.letter === question.correctLetter;
        state.answered = true;
        state.isCorrect = isCorrect;

        // Αποθήκευση στατιστικού στο localStorage
        saveQuestionStat(question.number, isCorrect);

        for (var i = 0; i < buttons.length; i++) {
          buttons[i].classList.add("disabled");
          buttons[i].disabled = true;
          var optLetter = question.options[i].letter;
          if (optLetter === question.correctLetter) {
            buttons[i].classList.add("correct");
          }
        }

        if (!isCorrect) {
          buttons[optIndex].classList.add("incorrect");
        }

        updateStats();
      }

      // === Στατιστικά quiz — localStorage persistence across sessions ===

      // Φόρτωση στατιστικών από localStorage
      function loadStats() {
        try {
          var raw = localStorage.getItem("quizStats");
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      // Αποθήκευση στατιστικού μίας ερώτησης
      function saveQuestionStat(questionNumber, isCorrect) {
        var stats = loadStats();
        var key = String(questionNumber);
        if (!stats[key]) {
          stats[key] = { attempts: 0, correct: 0, wrong: 0, lastResult: "" };
        }
        stats[key].attempts++;
        if (isCorrect) {
          stats[key].correct++;
          stats[key].lastResult = "correct";
        } else {
          stats[key].wrong++;
          stats[key].lastResult = "wrong";
        }
        try { localStorage.setItem("quizStats", JSON.stringify(stats)); } catch(e) { /* iOS private browsing */ }
      }

      // Εμφάνιση/κλείσιμο modal στατιστικών
      function toggleStatsPanel() {
        var overlay = document.getElementById("statsOverlay");
        if (overlay.classList.contains("open")) {
          overlay.classList.remove("open");
          return;
        }
        renderStatsPanel();
        overlay.classList.add("open");
      }
      function closeStatsPanel() {
        document.getElementById("statsOverlay").classList.remove("open");
      }

      // Δημιουργία HTML περιεχομένου stats panel
      function renderStatsPanel() {
        var stats = loadStats();
        var totalQuestions = questions.length;
        var answeredKeys = Object.keys(stats);
        var answeredCount = answeredKeys.length;

        var totalCorrect = 0;
        var totalAttempts = 0;
        for (var i = 0; i < answeredKeys.length; i++) {
          totalCorrect += stats[answeredKeys[i]].correct;
          totalAttempts += stats[answeredKeys[i]].attempts;
        }
        var successPct = totalAttempts > 0
          ? Math.round((totalCorrect / totalAttempts) * 100)
          : 0;
        var progressPct = Math.round((answeredCount / totalQuestions) * 100);

        // Προβληματικές ερωτήσεις (≥1 λάθος)
        var html = "";
        var problems = [];
        for (var j = 0; j < answeredKeys.length; j++) {
          var key = answeredKeys[j];
          if (stats[key].wrong > 0) {
            problems.push({
              num: Number(key),
              correct: stats[key].correct,
              wrong: stats[key].wrong || (stats[key].attempts - stats[key].correct),
              attempts: stats[key].attempts
            });
          }
        }
        problems.sort(function(a, b) { return (b.wrong / b.attempts) - (a.wrong / a.attempts); });

        html += "<h3>Προβληματικές ερωτήσεις (" + problems.length + ")</h3>";
        if (problems.length === 0) {
          html += '<p style="font-size:14px;color:#888;">Δεν υπάρχουν λάθος απαντήσεις ακόμα</p>';
        } else {
          html += '<ul class="problem-list">';
          for (var k = 0; k < problems.length; k++) {
            var p = problems[k];
            html += "<li>Ερ. " + p.num + '  <span style="color:#28a745;font-weight:600;">' + p.correct + '</span>/<span style="color:#dc3545;font-weight:600;">' + p.wrong + "</span></li>";
          }
          html += "</ul>";
        }

        document.getElementById("statsContent").innerHTML = html;
      }

      function addTapListener(el, handler) {

        // iOS: touchend ως fallback αν το click δεν πυροδοτηθεί
        el.addEventListener("touchend", function(e) {

        var isDark = document.body.classList.contains("dark");
        document.getElementById("themeToggle").textContent = isDark ? "☀️" : "🌙";
        // Ενημέρωση mobile button label
        document.getElementById("themeToggleMobile").textContent = isDark ? "☀️ Light mode" : "🌙 Dark mode";
      }

      // Κοινή λογική εναλλαγής theme
      function toggleTheme() {
        document.body.classList.toggle("dark");
        try {
          localStorage.setItem(
            "quizTheme",
            document.body.classList.contains("dark") ? "dark" : "light"
          );
        } catch(e) { /* iOS private browsing */ }
        updateThemeIcon();
      }

      addTapListener(document.getElementById("themeToggle"), toggleTheme);
      addTapListener(document.getElementById("themeToggleMobile"), function() {
        closeMobileMenu();
        toggleTheme();
      });

      initTheme();

      // === Μέγεθος γραμματοσειράς — αποθήκευση στο localStorage ===
      var FONT_STEP = 2;
      var FONT_DEFAULT = 14;

      // Εφαρμογή μεγέθους γραμματοσειράς στο container ερωτήσεων — χωρίς όριο
      function applyFontSize(size) {
        var container = document.getElementById("questionsContainer");
        if (container) {
          container.style.fontSize = size + "px";
        }
      }

      function initFontSize() {
        try {
          var saved = localStorage.getItem("quizFontSize");
          if (saved) {
            applyFontSize(Number(saved));
          }
        } catch(e) { /* iOS private browsing */ }
      }

      function changeFontSize(delta) {
        var container = document.getElementById("questionsContainer");
        var current = container ? parseFloat(getComputedStyle(container).fontSize) : FONT_DEFAULT;
        current = current || FONT_DEFAULT;
        var next = Math.max(8, current + delta); // ελάχιστο 8px μόνο για αναγνωσιμότητα
        applyFontSize(next);
        try { localStorage.setItem("quizFontSize", next); } catch(e) {}
      }

      // Desktop
      addTapListener(document.getElementById("fontIncBtn"), function() { changeFontSize(FONT_STEP); });
      addTapListener(document.getElementById("fontDecBtn"), function() { changeFontSize(-FONT_STEP); });
      // Mobile bar buttons (A-/A+ δίπλα στα badges)
      addTapListener(document.getElementById("fontIncBtnBar"), function() { changeFontSize(FONT_STEP); });
      addTapListener(document.getElementById("fontDecBtnBar"), function() { changeFontSize(-FONT_STEP); });

      initFontSize();

      renderQuestions();
      updateStats();
    </script>
  </body>
</html>
